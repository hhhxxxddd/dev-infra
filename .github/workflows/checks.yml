name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install ruff
      - run: python -m unittest discover -v tests
        env:
          PYTHONPATH: src
      - run: ruff check src scripts/dev-infra.py tests
      - run: ruff format --check src scripts/dev-infra.py tests
      - name: Parse PowerShell entrypoints and installers
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem scripts -Filter *.ps1) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors) { throw ($errors | Out-String) }
          }
      - name: Check Bash entrypoints and installers
        if: runner.os == 'Linux'
        run: |
          bash -n dev-infra
          for file in scripts/*.sh; do bash -n "$file"; done
          shellcheck dev-infra scripts/*.sh
